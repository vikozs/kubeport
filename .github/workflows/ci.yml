name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: make lint
      - run: make test
      - run: make build
      - run: make fixtures
      - name: dogfood (SARIF for the fixtures)
        run: bin/kubeport check --to openshift:4.19,k8s:1.32/eks,k3s:1.31 --format sarif --fail-on none fixtures > kubeport.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: kubeport.sarif
          path: kubeport.sarif
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check site for broken internal links and em-dashes
        run: |
          ! grep -n "—" site/index.html
          test -f site/_headers
