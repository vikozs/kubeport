name: targets-freshness
# Nightly reminder that target facts are data and go stale: fails when a
# shipped target is older than the newest release we know about.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: latest upstream Kubernetes minor
        id: k8s
        run: |
          latest=$(curl -fsSL https://dl.k8s.io/release/stable.txt | sed -E 's/^v([0-9]+\.[0-9]+).*/\1/')
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - name: compare with shipped targets
        run: |
          shipped=$(ls internal/targets/data/k8s/*.yaml | sed -E 's|.*/([0-9.]+)\.yaml|\1|' | sort -V | tail -1)
          echo "shipped k8s $shipped, upstream stable ${{ steps.k8s.outputs.latest }}"
          if [ "$(printf '%s\n%s\n' "$shipped" "${{ steps.k8s.outputs.latest }}" | sort -V | tail -1)" != "$shipped" ]; then
            echo "::warning::Kubernetes ${{ steps.k8s.outputs.latest }} is out; add internal/targets/data/k8s/${{ steps.k8s.outputs.latest }}.yaml"
            exit 1
          fi
